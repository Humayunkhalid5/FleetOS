<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FleetOS Super Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Private FleetOS Super Admin console." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fleetos-admin-theme');
          var theme = stored || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>html { background: #F4F7FA; } html[data-theme='dark'] { background: #060B15; }</style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
